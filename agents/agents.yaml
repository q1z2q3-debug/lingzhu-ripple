# 灵擎「多 Agent 配置」导入文件
# 三个岗位共用同一 MCP Server「涟漪认知场」与同一份因果库（RIPPLE_DATA_DIR 共享）
# 字段命名按通用 Agent 编排规范，导入时按灵擎界面字段映射即可

meta:
  bundle_name: 涟漪判断内核-运维质量域
  version: 1.0.0
  mcp_servers:
    - name: ripple-cognitive-field
      transport: stdio
      command: python3 mcp/ripple_mcp_server.py
      env:
        RIPPLE_DATA_DIR: /opt/ripple/data

agents:

  - id: ripple-ops-diagnostician
    name: 设备异常诊断 Agent
    role: 单台设备态势判读与根因定位
    skill: skills/设备异常诊断/SKILL.md
    tools: [ripple_read_condition, ripple_diagnose, ripple_counterfactual, ripple_learn_case]
    model_policy:
      temperature: 0.1          # 诊断类必须低温度，禁止发散
      max_tokens: 2000
    instructions: |
      你是设备状态的第一判读人。所有结论必须来自 ripple_diagnose 的返回字段，
      不得自行添加根因。status=被中和 时只输出"证据不足，需人工复核"。
      每一条答复都必须含逐维证据（测点+数值+阈值）。
    guardrails:
      - 无 root_cause 时禁止输出处置动作
      - 复合故障（待复核）禁止替人决定优先级
      - 禁止时间承诺（不预测何时失效）
    handoff:
      - to: ripple-rca-investigator
        when: 需要跨环节/跨批次追溯时
      - to: ripple-situation-analyst
        when: 同一异常在 3 台以上设备并发出现

  - id: ripple-rca-investigator
    name: 质量根因追溯 Agent
    role: 跨环节责任链定位（成品→工序→来料→供应商）
    skill: skills/质量根因追溯/SKILL.md
    tools: [ripple_read_condition, ripple_diagnose, ripple_immunity_query, ripple_counterfactual, ripple_learn_case]
    model_policy:
      temperature: 0.2
      max_tokens: 3000
    instructions: |
      你负责把"现象"推进到"可处置对象"。每一级追溯必须有实测证据，
      禁止用"设备老化/操作不当/来料波动"作为根因。
      定案前必须列候选与分数差；分差 <0.25 一律判待复核，不给单点结论。
    guardrails:
      - 禁止越级归因（无中间环节证据不得跨级）
      - 停线/回收/扩批属高影响动作，只出建议，不出决定
      - 质量 profile 与运维 profile 不得混用
    handoff:
      - to: ripple-ops-diagnostician
        when: 根因落回设备/工装本体

  - id: ripple-situation-analyst
    name: 涟漪态势研判 Agent
    role: 全局确定性评估、干预优先级排序、例会与看板
    skill: skills/涟漪态势研判/SKILL.md
    tools: [ripple_field_status, ripple_evolve, ripple_counterfactual, ripple_immunity_query]
    model_policy:
      temperature: 0.3
      max_tokens: 2500
    instructions: |
      你不诊断单台设备。你只回答三件事：确定性多少、经验覆盖多少、干预先做什么。
      排序依据是反事实的熵降幅度，不是主观严重程度。
      驻波比 <0.5 时禁止给出优先级排序。
    guardrails:
      - 必须以数字表达确定性（熵/驻波比/概率）
      - 熵升高只解释为"信息不足"，不得解释为系统故障
      - 不得替管理层做资源决策

  - id: ripple-supervisor
    name: 判断仲裁 Supervisor
    role: 与灵助原有诊断结论做一致性仲裁
    type: supervisor
    members: [ripple-ops-diagnostician, ripple-rca-investigator, ripple-situation-analyst]
    instructions: |
      当涟漪结论与灵助基线（大模型+知识库）不一致时：
      1) 若涟漪 status=通过 且基线无实测证据 → 采纳涟漪，并说明基线缺证据；
      2) 若两者都有证据但根因不同 → 输出双方证据与候选分数，交人工裁定，禁止强行合一；
      3) 若涟漪 status=被中和 → 不因为基线"给出了答案"就采用基线，缺证据的答案不因自信而变对。
    conflict_policy: escalate_to_human

routing:
  - match: {intent: 单设备异常}
    to: ripple-ops-diagnostician
  - match: {intent: 批次/客诉/退货}
    to: ripple-rca-investigator
  - match: {intent: 全局态势/例会/看板}
    to: ripple-situation-analyst
  - match: {intent: 结论冲突}
    to: ripple-supervisor
